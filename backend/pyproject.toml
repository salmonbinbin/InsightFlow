[project]
name = "insightflow-backend"
version = "0.1.0"
description = "InsightFlow raw feedback ingestion API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.136",
 "starlette>=0.46,<1",
 "anyio>=4,<4.12",
 "uvicorn[standard]>=0.34,<1",
 "sqlalchemy>=2.0,<3",
 "psycopg[binary]>=3.2,<4",
 "alembic>=1.14,<2",
 "pydantic-settings>=2.7,<3",
 "python-multipart>=0.0.20,<1",
 "httpx>=0.28,<1",
 "pgvector>=0.3,<0.5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
