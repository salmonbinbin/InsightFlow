services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: insightflow
      POSTGRES_PASSWORD: insightflow_local
      POSTGRES_DB: insightflow
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - insightflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightflow -d insightflow"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  insightflow_pgdata:
